# vLLM Hydra Cluster - Spark-2 Workers
#
# Deployed to spark-2 (192.168.1.63 / 100.87.229.92)
# Primary on spark-1 (192.168.1.76 / 100.70.220.58)
#
# IMPORTANT: Uses host network mode (same as spark-1) for stability
#
# Default services (started with `docker compose up -d`):
#   - Embeddings (port 8001) - always started
#   - OCR (port 8003) - always started
#
# Optional services (require explicit profile):
#   - GPT-OSS (port 8004) - DISABLED by default on spark-2
#   - Embeddings-2 (port 8002) - scaled mode only
#
# Usage:
#   docker compose up -d                                       # Core services (embeddings + OCR)
#   docker compose --profile embeddings-scaled up -d           # 2x Embeddings
#   docker compose --profile vllm-gpt-oss-20b up -d            # With GPT-OSS (NOT recommended)
#   docker compose --profile vllm-hunyuanOCR up -d             # OCR only (profile mode)
#
# GPU Memory Constraints:
#   - Embeddings: 10% each (can run with any service)
#   - OCR:        40% (default service)
#   - GPT-OSS:    50% (DISABLED - conflicts with OCR, run on spark-1 instead)
#
# NOTE: GPT-OSS is disabled on spark-2 by default. The primary GPT-OSS
# service runs on spark-1 and is accessible via the Traefik load balancer.

name: vllm-hydra-spark2

services:
  # ===========================================================================
  # EMBEDDINGS - vllm-freelaw-modernbert
  # FreeLaw ModernBERT for semantic search - added to Traefik LB on spark-1
  # Starts by default (no profile required)
  # NOTE: Same name as spark-1 - runs on different machine
  # ===========================================================================
  vllm-freelaw-modernbert:
    container_name: vllm-freelaw-modernbert
    image: ${VLLM_IMAGE:-vllm/vllm-openai:nightly-aarch64}
    restart: unless-stopped
    entrypoint: >
      /bin/bash -c "vllm serve ${EMBEDDINGS_MODEL:-freelawproject/modernbert-embed-base_finetune_512}
      --host 0.0.0.0
      --port 8001
      --gpu-memory-utilization ${EMBEDDINGS_GPU_MEMORY_UTIL:-0.10}
      --max-model-len 512
      --dtype auto
      --trust-remote-code"
    network_mode: host
    volumes:
      - ${HF_CACHE_DIR:-/home/rooot/.cache/huggingface}:/root/.cache/huggingface
    environment:
      - CUDA_VISIBLE_DEVICES=0
      - TORCH_CUDA_ARCH_LIST=${TORCH_CUDA_ARCH_LIST:-12.1a}
      - TRITON_PTXAS_PATH=/usr/local/cuda/bin/ptxas
      - PATH=/usr/local/cuda/bin:$PATH
      - LD_LIBRARY_PATH=/usr/local/cuda/lib64:$LD_LIBRARY_PATH
      - HF_HOME=/root/.cache/huggingface
    shm_size: ${SHM_SIZE:-10.24g}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    labels:
      - "hydra.service=embeddings"
      - "hydra.node=spark-2"
      - "hydra.port=8001"

  # ===========================================================================
  # EMBEDDINGS REPLICA 2 - vllm-freelaw-modernbert-2
  # Second FreeLaw ModernBERT instance on spark-2 - port 8002
  # Starts by default (GPT-OSS disabled, so we have room)
  # ===========================================================================
  vllm-freelaw-modernbert-2:
    container_name: vllm-freelaw-modernbert-2
    image: ${VLLM_IMAGE:-vllm/vllm-openai:nightly-aarch64}
    restart: unless-stopped
    entrypoint: >
      /bin/bash -c "vllm serve ${EMBEDDINGS_MODEL:-freelawproject/modernbert-embed-base_finetune_512}
      --host 0.0.0.0
      --port 8002
      --gpu-memory-utilization ${EMBEDDINGS_GPU_MEMORY_UTIL:-0.10}
      --max-model-len 512
      --dtype auto
      --trust-remote-code"
    network_mode: host
    volumes:
      - ${HF_CACHE_DIR:-/home/rooot/.cache/huggingface}:/root/.cache/huggingface
    environment:
      - CUDA_VISIBLE_DEVICES=0
      - TORCH_CUDA_ARCH_LIST=${TORCH_CUDA_ARCH_LIST:-12.1a}
      - TRITON_PTXAS_PATH=/usr/local/cuda/bin/ptxas
      - PATH=/usr/local/cuda/bin:$PATH
      - LD_LIBRARY_PATH=/usr/local/cuda/lib64:$LD_LIBRARY_PATH
      - HF_HOME=/root/.cache/huggingface
    shm_size: ${SHM_SIZE:-10.24g}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    labels:
      - "hydra.service=embeddings-2"
      - "hydra.node=spark-2"
      - "hydra.port=8002"

  # ===========================================================================
  # GPT-OSS 20B - vllm-gpt-oss-20b (DISABLED BY DEFAULT)
  # GPT-OSS inference service - uses NVIDIA vLLM 25.12 for harmony tokenizer
  # Profile: --profile vllm-gpt-oss-20b
  #
  # WARNING: GPT-OSS is DISABLED on spark-2 by default because:
  #   1. Conflicts with OCR (CUDA graph compilation)
  #   2. Primary inference runs on spark-1
  #   3. Access via Traefik LB on spark-1:8020
  # ===========================================================================
  vllm-gpt-oss-20b:
    container_name: vllm-gpt-oss-20b
    image: nvcr.io/nvidia/vllm:25.12-py3
    restart: unless-stopped
    profiles:
      - vllm-gpt-oss-20b
    entrypoint: >
      /bin/bash -c "vllm serve ${GPT_OSS_20B_MODEL:-openai/gpt-oss-20b}
      --host 0.0.0.0
      --port 8004
      --gpu-memory-utilization ${GPT_OSS_GPU_MEMORY_UTIL:-0.50}
      --max-model-len ${GPT_OSS_20B_MAX_MODEL_LEN:-8192}
      --max-num-seqs 32
      --dtype auto
      --trust-remote-code"
    network_mode: host
    volumes:
      - ${HF_CACHE_DIR:-/home/rooot/.cache/huggingface}:/root/.cache/huggingface
      - vllm-compile-cache:/root/.cache/vllm
    environment:
      - CUDA_VISIBLE_DEVICES=0
      - TORCH_CUDA_ARCH_LIST=${TORCH_CUDA_ARCH_LIST:-12.1a}
      - TRITON_PTXAS_PATH=/usr/local/cuda/bin/ptxas
      - PATH=/usr/local/cuda/bin:$PATH
      - LD_LIBRARY_PATH=/usr/local/cuda/lib64:$LD_LIBRARY_PATH
      - HF_HOME=/root/.cache/huggingface
    shm_size: ${SHM_SIZE:-10.24g}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s
    labels:
      - "hydra.service=inference"
      - "hydra.node=spark-2"
      - "hydra.port=8004"

  # ===========================================================================
  # OCR - vllm-hunyuanOCR
  # HunyuanOCR for document processing - uses nightly for hunyuan_vl support
  # Starts by default (no profile required)
  # NOTE: Same name as spark-1 - runs on different machine
  # ===========================================================================
  vllm-hunyuanOCR:
    container_name: vllm-hunyuanOCR
    image: vllm/vllm-openai:nightly-aarch64
    restart: unless-stopped
    entrypoint: >
      /bin/bash -c "vllm serve ${HUNYUAN_OCR_MODEL:-tencent/HunyuanOCR}
      --no-enable-prefix-caching
      --mm-processor-cache-gb 0
      --gpu-memory-utilization ${HUNYUAN_OCR_GPU_MEMORY_UTIL:-0.40}
      --host 0.0.0.0
      --port 8003"
    network_mode: host
    volumes:
      - ${HF_CACHE_DIR:-/home/rooot/.cache/huggingface}:/root/.cache/huggingface
    environment:
      - CUDA_VISIBLE_DEVICES=0
      - TORCH_CUDA_ARCH_LIST=${TORCH_CUDA_ARCH_LIST:-12.1a}
      - TRITON_PTXAS_PATH=/usr/local/cuda/bin/ptxas
      - PATH=/usr/local/cuda/bin:$PATH
      - LD_LIBRARY_PATH=/usr/local/cuda/lib64:$LD_LIBRARY_PATH
      - HF_HOME=/root/.cache/huggingface
    shm_size: ${SHM_SIZE:-10.24g}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    labels:
      - "hydra.service=ocr"
      - "hydra.node=spark-2"
      - "hydra.port=8003"

volumes:
  vllm-compile-cache:
